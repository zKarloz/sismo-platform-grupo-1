<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="description" content="Plataforma académica de monitoreo sísmico y análisis de datos." />
  <title>Sismo Platform | Monitoreo Sísmico</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    // BLOQUE 1 — Evitar destello de tema incorrecto antes de montar React.
    try {
      if (localStorage.getItem('sismo-platform-theme') === 'dark') {
        document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = 'dark'
      } else {
        document.documentElement.style.colorScheme = 'light'
      }
    } catch {
      document.documentElement.style.colorScheme = 'light'
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
